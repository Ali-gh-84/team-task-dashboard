<div class="container-fluid">
  <div class="row d-flex align-items-center justify-content-center mx-0 mx-2 pt-5">
    <div class="glass-form pt-5">
      <div class="col mt-3">
        <h4 class="head text-center">
          Login Form
        </h4>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-5">
          <div *ngFor="let i of fc.formFields" [ngSwitch]="i.type">

            <div *ngSwitchCase="'password'">
              <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;">
                <mat-label>{{ i.label }}</mat-label>
                <input
                  matInput
                  [type]="visibleField ? 'text' : 'password'"
                  [formControlName]="i.formName"
                />
                <button
                  mat-icon-button
                  matSuffix
                  type="button"
                  (click)="showpass()"
                  [attr.aria-label]="visibleField ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="visibleField"
                >
                  <mat-icon>{{ visibleField ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>
            </div>

            <div *ngSwitchDefault>
              <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;">
                <mat-label>{{ i.label }}</mat-label>
                <input matInput [type]="i.type" [formControlName]="i.formName"/>
              </mat-form-field>
            </div>
          </div>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="p-4 mt-4 rounded-7"
            [disabled]="loginForm.invalid"
            style="width: 100%;"
          >
            login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
